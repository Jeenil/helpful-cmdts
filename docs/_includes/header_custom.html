<button class="theme-toggle js-toggle-theme" type="button" role="switch" aria-checked="false" aria-label="Dark mode" title="Toggle theme">
  <svg class="icon-sun" viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
    <circle cx="12" cy="12" r="4" />
    <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41" />
  </svg>
  <svg class="icon-moon" viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
    <path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z" />
  </svg>
  <span class="theme-toggle-knob"></span>
</button>

<script>
  (function () {
    var button = document.querySelector(".js-toggle-theme");
    var saved = localStorage.getItem("theme");
    // Dark by default, like sillydodo.net.
    var preferred = saved || "dark";

    function apply(theme) {
      jtd.setTheme(theme);
      document.documentElement.setAttribute("data-theme", theme);
      button.setAttribute("aria-checked", theme === "dark");
    }

    apply(preferred);

    jtd.addEvent(button, "click", function () {
      var next = jtd.getTheme() === "dark" ? "light" : "dark";
      apply(next);
      localStorage.setItem("theme", next);
    });
  })();
</script>
